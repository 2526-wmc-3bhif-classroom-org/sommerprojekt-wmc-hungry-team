services:
  neo4j:
    image: neo4j:5-community
    container_name: gtfs_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 4G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_transaction_total_max: 4G
    ports:
      - "${NEO4J_BOLT_PORT}:7687"
      - "${NEO4J_HTTP_PORT}:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  neo4j-loader:
    image: node:20-alpine
    container_name: gtfs_neo4j_loader
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    environment:
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=4096"
    working_dir: /scripts
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache unzip curl &&
        npm install neo4j-driver dotenv &&
        node load-gtfs-neo4j.js

volumes:
  neo4j_data:
  neo4j_logs:
