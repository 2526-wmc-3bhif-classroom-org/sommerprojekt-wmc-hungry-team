services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: gtfs_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  loader:
    image: node:20-alpine
    container_name: gtfs_loader
    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data:/data

    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}

    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache unzip postgresql-client &&
        npm install -g gtfs-via-postgres &&
        mkdir /gtfs &&
        unzip /data/LINZ_AG_GTFS_2026.zip -d /gtfs &&
        sed -i 's/,"DE",/,"de",/g' /gtfs/feed_info.txt &&
        sh -c "gtfs-to-sql /gtfs/*.txt | psql -v ON_ERROR_STOP=1"

  neo4j:
    image: neo4j:5-community
    container_name: gtfs_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "${NEO4J_BOLT_PORT}:7687"
      - "${NEO4J_HTTP_PORT}:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  neo4j-loader:
    image: node:20-alpine
    container_name: gtfs_neo4j_loader
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    environment:
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    working_dir: /scripts
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache unzip curl &&
        npm install neo4j-driver dotenv &&
        node load-gtfs-neo4j.js

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
