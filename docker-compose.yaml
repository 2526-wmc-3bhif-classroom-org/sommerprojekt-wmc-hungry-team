services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: gtfs_db
    environment:
      - POSTGRES_USER=transit_user
      - POSTGRES_PASSWORD=your_secure_password
      - POSTGRES_DB=gtfs_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/gtfs_raw  # Mounts your GTFS files into the container

volumes:
  postgres_data: